<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IKONIQ — 3D Model Viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1c2230; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #e6edf3; overflow: hidden; }
  #app { position: fixed; inset: 0; }

  /* HUD */
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(18,22,30,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
    padding: 14px 16px; max-width: 320px; line-height: 1.45;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  #hud h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .02em; }
  #hud .sub { font-size: 12px; color: #8b98a8; margin: 0 0 10px; }
  #hud .dim { font-size: 12px; color: #aeb9c7; }
  #hud .legend { font-size: 11px; color: #7f8b9a; margin-top: 8px; border-top: 1px solid rgba(255,255,255,.07); padding-top: 8px; }
  .row { display:flex; gap:8px; flex-wrap: wrap; margin-top:10px; }
  button {
    font: inherit; font-size: 12px; color:#e6edf3; cursor:pointer;
    background:#1c2330; border:1px solid rgba(255,255,255,.12);
    border-radius:8px; padding:6px 10px;
  }
  button:hover { background:#26303f; }
  button.active { background:#2d6cdf; border-color:#2d6cdf; }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index:10;
    font-size: 12px; color:#6b7686; background: rgba(18,22,30,.7); padding:6px 12px; border-radius: 20px; }

  /* Hamburger + drawer */
  #burger {
    position: fixed; top: 16px; right: 16px; z-index: 30;
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(18,22,30,.9); border:1px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer;
  }
  #burger span { display:block; width:20px; height:2px; background:#e6edf3; border-radius:2px; transition:.2s; }
  #drawer {
    position: fixed; top:0; right:0; height:100%; width:300px; z-index:29;
    background: rgba(14,18,26,.97); backdrop-filter: blur(10px);
    border-left:1px solid rgba(255,255,255,.08); box-shadow:-8px 0 40px rgba(0,0,0,.5);
    transform: translateX(100%); transition: transform .25s ease; padding: 70px 18px 18px;
    overflow-y:auto;
  }
  #drawer.open { transform: translateX(0); }
  #drawer h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#7f8b9a; margin:0 0 12px; }
  .model-item {
    display:flex; align-items:center; gap:10px; padding:12px 14px; margin-bottom:8px;
    border-radius:10px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.02);
    cursor:pointer; transition:.15s;
  }
  .model-item:hover { background:rgba(255,255,255,.06); }
  .model-item.active { border-color:#2d6cdf; background:rgba(45,108,223,.16); }
  .model-item .nm { font-size:14px; font-weight:600; }
  .model-item .ds { font-size:11px; color:#8b98a8; margin-top:2px; }
  .model-item .dot { width:8px; height:8px; border-radius:50%; background:#3a4150; flex:none; }
  .model-item.active .dot { background:#2d6cdf; }
  #scrim { position:fixed; inset:0; z-index:28; background:rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; }
  #scrim.show { opacity:1; pointer-events:auto; }

  /* Loading + gate */
  #loading { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    color:#8b98a8; font-size:13px; background:rgba(12,15,20,.4); }
  #loading.show { display:flex; }
  #gate { position: fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:#0c0f14; }
  #gate.hidden { display:none; }
  #gate .card { background: rgba(18,22,30,.96); border:1px solid rgba(255,255,255,.1); border-radius:14px;
    padding:28px 26px; width:300px; text-align:center; box-shadow:0 12px 50px rgba(0,0,0,.6); }
  #gate h2 { margin:0 0 6px; font-size:16px; }
  #gate p { margin:0 0 16px; font-size:12px; color:#8b98a8; }
  #gate input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px;
    border:1px solid rgba(255,255,255,.15); background:#11151c; color:#e6edf3; font:inherit; }
  #gate button { margin-top:12px; width:100%; padding:10px; background:#2d6cdf; border:none;
    border-radius:8px; color:#fff; font:inherit; cursor:pointer; }
  #gate .err { color:#ff6b6b; font-size:12px; min-height:16px; margin-top:8px; }
</style>

<body>
<div id="gate">
  <div class="card">
    <h2>Gordie's 3D Maker Machine</h2>
    <p>Enter password to view</p>
    <input id="gate-pw" type="password" placeholder="Password" autocomplete="current-password" />
    <div class="err" id="gate-err"></div>
    <button id="gate-go">Unlock</button>
  </div>
</div>
<script>
(function(){
  var PW = "97prelude";
  var KEY = "poscart_auth_until";
  var now = Date.now();
  var until = parseInt(localStorage.getItem(KEY) || "0", 10);
  var gate = document.getElementById('gate');
  function unlock(){ gate.classList.add('hidden'); }
  if (until && now < until) { unlock(); return; }          // already unlocked today
  var input = document.getElementById('gate-pw');
  var err = document.getElementById('gate-err');
  function tryPw(){
    if (input.value === PW){
      localStorage.setItem(KEY, String(now + 24*60*60*1000)); // remember for 24h
      unlock();
    } else { err.textContent = "Incorrect password"; input.select(); }
  }
  document.getElementById('gate-go').onclick = tryPw;
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryPw(); });
  input.focus();
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ===================== shared scene =====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c2230);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.5;
document.getElementById('app').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

// lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
scene.add(new THREE.HemisphereLight(0xdce6f5, 0x2a2f38, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(60, 100, 80);
key.castShadow = true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=1; key.shadow.camera.far=2000;
key.shadow.camera.left=-200; key.shadow.camera.right=200; key.shadow.camera.top=200; key.shadow.camera.bottom=-200;
key.shadow.bias = -0.0004; scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 1.4); fill.position.set(-90, 55, -30); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(0, 60, -100); scene.add(rim);
const front= new THREE.DirectionalLight(0xffffff, 1.0); front.position.set(0, 30, 120); scene.add(front);

// ground
const ground = new THREE.Mesh(new THREE.CircleGeometry(2000, 64), new THREE.MeshStandardMaterial({color:0x2a313d, roughness:1, metalness:0}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(4000, 80, 0x4a5a6e, 0x33414f); scene.add(grid);

// ===================== materials =====================
const M = {
  wrap:    new THREE.MeshStandardMaterial({ color: 0x33373d, roughness: 0.5,  metalness: 0.15 }),
  toekick: new THREE.MeshStandardMaterial({ color: 0x202327, roughness: 0.65, metalness: 0.3  }),
  counter: new THREE.MeshStandardMaterial({ color: 0x3a3e44, roughness: 0.3,  metalness: 0.1  }),
  steel:   new THREE.MeshStandardMaterial({ color: 0xc8ccd4, roughness: 0.28, metalness: 0.9  }),
  caster:  new THREE.MeshStandardMaterial({ color: 0x44484f, roughness: 0.5,  metalness: 0.6  }),
  screen:  new THREE.MeshStandardMaterial({ color: 0x0a1320, roughness: 0.15, metalness: 0.1, emissive: 0x16335c, emissiveIntensity: 0.9 }),
  shelf:   new THREE.MeshStandardMaterial({ color: 0x2c3036, roughness: 0.55, metalness: 0.2  }),
  grommet: new THREE.MeshStandardMaterial({ color: 0x5a5e66, roughness: 0.4,  metalness: 0.7  }),
  accent:  new THREE.MeshStandardMaterial({ color: 0x232730, roughness: 0.4,  metalness: 0.25 }),
  wood:      new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 0.62, metalness: 0.05 }),
  glass:     new THREE.MeshStandardMaterial({ color: 0xbcd4e0, transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0.0 }),
  blackpost: new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.4,  metalness: 0.6  }),
  header:    new THREE.MeshStandardMaterial({ color: 0x4a4d52, roughness: 0.5,  metalness: 0.45 }),
  monitor:   new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.28, metalness: 0.2, emissive: 0x232a33, emissiveIntensity: 0.35 }),
  white:     new THREE.MeshStandardMaterial({ color: 0xeceef0, roughness: 0.5,  metalness: 0.1  }),
  posScreen: new THREE.MeshStandardMaterial({ color: 0x10141a, roughness: 0.2,  metalness: 0.1, emissive: 0x0a1422, emissiveIntensity: 0.5 }),
  stainlessLite: new THREE.MeshStandardMaterial({ color: 0xc6cace, roughness: 0.3, metalness: 0.55 }),
  wellInner: new THREE.MeshStandardMaterial({ color: 0x6e747b, roughness: 0.45, metalness: 0.5 }),
};
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }

// ===================== model: 4'-6" POS Cart (parametric) =====================
function buildPosCart(){
  const W = 54, D = 30, COUNTER_H = 34, CASTER_H = 3, TOEKICK_H = 4, TOP_THK = 2;
  const BODY_H = COUNTER_H - CASTER_H - TOP_THK;
  const BASE_OH = 1.75, COUNTER_OH = 2;
  const cart = new THREE.Group();

  // casters
  const casterGeo = new THREE.CylinderGeometry(1.5,1.5,1.4,24);
  const stemGeo = new THREE.CylinderGeometry(0.5,0.5,CASTER_H-1.4,12);
  const cx = W/2-4, cz = D/2-4;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const g=new THREE.Group();
    const wheel=new THREE.Mesh(casterGeo,M.caster); wheel.rotation.z=Math.PI/2; wheel.position.y=1.5; wheel.castShadow=true;
    const stem=new THREE.Mesh(stemGeo,M.steel); stem.position.y=1.5+(CASTER_H-1.4)/2;
    g.add(wheel,stem); g.position.set(sx*cx,0,sz*cz); cart.add(g);
  });
  // base/toekick — sticks out front + sides, flush back (-Z)
  const toekick = box(W+BASE_OH*2, TOEKICK_H, D+BASE_OH, M.toekick);
  toekick.position.set(0, CASTER_H+TOEKICK_H/2, BASE_OH/2); cart.add(toekick);
  // body
  const bodyH = BODY_H - TOEKICK_H;
  const body = box(W, bodyH, D, M.wrap); body.position.y = CASTER_H+TOEKICK_H+bodyH/2; cart.add(body);
  // graphic band
  const band = box(W*0.92, bodyH*0.34, 0.4, M.accent); band.position.set(0, CASTER_H+TOEKICK_H+bodyH*0.5, D/2+0.2); cart.add(band);
  // rear doors + handles
  const doorW=(W-3)/2, doorH=bodyH*0.78, doorY=CASTER_H+TOEKICK_H+bodyH*0.46;
  [-1,1].forEach(s=>{
    const door=box(doorW-0.6, doorH, 0.6, new THREE.MeshStandardMaterial({color:0x26292e,roughness:0.5,metalness:0.25}));
    door.position.set(s*(doorW/2+0.4), doorY, -D/2-0.3); cart.add(door);
    const handle=box(0.5,4,0.8,M.steel); handle.position.set(s*(doorW/2+0.4)-s*(doorW/2-2), doorY, -D/2-0.7); cart.add(handle);
  });
  // countertop — overhang front + sides, flush back
  const top = box(W+COUNTER_OH*2, TOP_THK, D+COUNTER_OH, M.counter);
  top.position.set(0, CASTER_H+BODY_H+TOP_THK/2, COUNTER_OH/2); cart.add(top);
  const COUNTER_TOP_Y = CASTER_H+BODY_H+TOP_THK;
  // grommets
  const grGeo=new THREE.CylinderGeometry(1.4,1.4,0.5,20);
  [-W*0.18, W*0.18].forEach(gx=>{ const gr=new THREE.Mesh(grGeo,M.grommet); gr.position.set(gx,COUNTER_TOP_Y+0.1,D*0.12); cart.add(gr); });
  // undercounter shelf
  const shelf=box(W-6,0.8,D-6,M.shelf); shelf.position.y=CASTER_H+TOEKICK_H+bodyH*0.45; cart.add(shelf);
  // POS terminals
  function term(x){ const g=new THREE.Group();
    const base=box(8,1.2,7,M.steel); base.position.set(0,0.6,0); g.add(base);
    const stem=box(1.4,7,1.4,M.steel); stem.position.set(0,4.5,-1.5); g.add(stem);
    const bezel=box(11.6,8.6,0.6,new THREE.MeshStandardMaterial({color:0x111317,roughness:0.4,metalness:0.4})); bezel.position.set(0,9.5,-1.55); bezel.rotation.x=-0.18; g.add(bezel);
    const screen=box(11,8,1,M.screen); screen.position.set(0,9.5,-1.2); screen.rotation.x=-0.18; g.add(screen);
    g.position.set(x, COUNTER_TOP_Y, -D*0.12); return g; }
  cart.add(term(-W*0.2), term(W*0.2));
  return cart;
}

// ===================== model: 18110 Kiosk (parametric, 2 sections) =====================
function buildKiosk18110(){
  const root = new THREE.Group();
  const SECT_W = 66, D = 30, COUNTER_H = 36;
  const CASTER_H = 2.5, BASE_H = 3.5, TOP_THK = 1.5;
  const woodH = COUNTER_H - CASTER_H - BASE_H - TOP_THK;   // 28.5
  const baseY = CASTER_H + BASE_H/2;
  const bodyY = CASTER_H + BASE_H + woodH/2;
  const counterY = COUNTER_H - TOP_THK/2;
  const TOP = COUNTER_H;

  // one cabinet module centered at xc
  function section(xc){
    const g = new THREE.Group();
    const cg = new THREE.CylinderGeometry(1.2,1.2,CASTER_H,16);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
      const c=new THREE.Mesh(cg,M.caster); c.castShadow=true;
      c.position.set(xc+sx*(SECT_W/2-5), CASTER_H/2, sz*(D/2-4)); g.add(c);
    });
    const base=box(SECT_W, BASE_H, D, M.toekick); base.position.set(xc,baseY,0); g.add(base);
    const body=box(SECT_W-0.5, woodH, D, M.wood); body.position.set(xc,bodyY,0); g.add(body);
    const top=box(SECT_W+0.5, TOP_THK, D+1, M.stainlessLite); top.position.set(xc,counterY,0.5); g.add(top);
    // food well insert
    const well=box(30,1.2,18,M.steel); well.position.set(xc, TOP+0.4, 3); g.add(well);
    const wellIn=box(27,1.1,15,M.wellInner); wellIn.position.set(xc, TOP+0.5, 3); g.add(wellIn);
    // glass sneeze-guard panel + posts (toward back)
    const glassH=14, zg=-4;
    const panel=box(SECT_W-7, glassH, 0.4, M.glass); panel.castShadow=false;
    panel.position.set(xc, TOP+glassH/2, zg); g.add(panel);
    const pg=new THREE.CylinderGeometry(0.4,0.4,glassH+2,12);
    [-1,0,1].forEach(k=>{ const p=new THREE.Mesh(pg,M.steel); p.position.set(xc+k*(SECT_W/2-4), TOP+glassH/2, zg); g.add(p); });
    return g;
  }

  // cantilevered side shelf + POS terminal
  function posStation(xc){
    const g=new THREE.Group();
    const shelfY=33;
    const shelf=box(18,1.2,16,M.white); shelf.position.set(xc, shelfY, 5); g.add(shelf);
    const pbase=box(7,1,6,M.white); pbase.position.set(xc, shelfY+1.1, 5); g.add(pbase);
    const stem=box(1.2,5,1.2,M.white); stem.position.set(xc, shelfY+3.5, 3); g.add(stem);
    const scr=box(9,7,0.8,M.posScreen); scr.position.set(xc, shelfY+7, 3); scr.rotation.x=-0.12; g.add(scr);
    return g;
  }

  // sections 1A (left) and 2A (right)
  const g1A=new THREE.Group(); g1A.name='1A';
  g1A.add(section(-SECT_W/2)); g1A.add(posStation(-SECT_W-9));
  const g2A=new THREE.Group(); g2A.name='2A';
  g2A.add(section(SECT_W/2));  g2A.add(posStation(SECT_W+9));

  // overhead canopy (shared signage): centered posts + header + twin monitors facing FRONT (+Z = customer)
  const shared=new THREE.Group(); shared.name='shared';
  const postH=50;
  const monY=COUNTER_H+postH-15;          // monitor vertical center
  [-30, 30].forEach(px=>{                 // symmetric posts rising from the back
    const post=box(2.5, postH, 2.5, M.blackpost); post.position.set(px, COUNTER_H+postH/2, -10); shared.add(post);
  });
  const head=box(108, 12, 13, M.header); head.position.set(0, COUNTER_H+postH-2, -7); shared.add(head);
  [-24, 24].forEach(mx=>{
    // black frame BEHIND (-Z), light screen in FRONT (+Z) so the display faces the customer
    const bez=box(45, 28, 1.0, M.blackpost); bez.position.set(mx, monY, -1.6); bez.rotation.x=0.05; shared.add(bez);
    const mon=box(42, 25, 0.6, M.monitor);  mon.position.set(mx, monY, -1.0); mon.rotation.x=0.05; shared.add(mon);
  });

  root.add(g1A, g2A, shared);
  return root;
}

// ===================== model loading / framing =====================
const gltf = new GLTFLoader();
let currentModel = null, activeId = null;
let modelCenter = new THREE.Vector3(), modelRadius = 50;

function disposeGroup(obj){
  obj.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  scene.remove(obj);
}
function setActive(id){
  activeId = id;
  document.querySelectorAll('.model-item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
}
function applyMeta(entry){
  document.getElementById('m-title').textContent = entry.name;
  document.getElementById('m-sub').textContent = entry.desc || 'IKONIQ · 3D viewer';
  document.getElementById('m-dim').textContent = entry.dims || '';
  document.getElementById('m-legend').textContent = entry.legend || '';
  const st = document.getElementById('dl-step-wrap');
  if (entry.step){ st.href = entry.step; st.style.display=''; } else { st.style.display='none'; }
}
function frameModel(){
  const bb = new THREE.Box3().setFromObject(currentModel);
  const size = bb.getSize(new THREE.Vector3());
  modelCenter = bb.getCenter(new THREE.Vector3());
  modelRadius = Math.max(size.x, size.y, size.z, 1) * 0.5;
  controls.minDistance = modelRadius*1.2;
  controls.maxDistance = modelRadius*10;
  setView('iso');
}
function showModel(entry){
  if (currentModel) disposeGroup(currentModel);
  const loading = document.getElementById('loading');
  applyMeta(entry); setActive(entry.id);
  if (entry.type === 'builder'){
    currentModel = entry.build(); scene.add(currentModel); frameModel(); renderIsolate(entry);
  } else if (entry.type === 'glb'){
    loading.classList.add('show');
    gltf.load(entry.url, g=>{
      currentModel = g.scene; currentModel.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
      scene.add(currentModel); frameModel(); renderIsolate(entry); loading.classList.remove('show');
    }, undefined, err=>{ loading.innerHTML='<span style="color:#ff6b6b">Failed to load model</span>'; console.error(err); });
  }
}

// isolate toggle — show one named sub-group at a time ('shared' groups always visible)
function setIsolate(key){
  if(!currentModel) return;
  currentModel.children.forEach(c=>{
    if(!c.name || c.name==='shared') return;
    c.visible = (key==='full' || c.name===key);
  });
  document.querySelectorAll('#isolate-row button').forEach(b=>b.classList.toggle('active', b.dataset.iso===key));
}
function renderIsolate(entry){
  const row=document.getElementById('isolate-row');
  row.innerHTML='';
  if(!entry.parts){ row.style.display='none'; return; }
  row.style.display='';
  const mk=(key,label)=>{ const b=document.createElement('button'); b.textContent=label; b.dataset.iso=key; b.onclick=()=>setIsolate(key); row.appendChild(b); };
  mk('full','Full');
  entry.parts.forEach(p=>mk(p, 'Isolate '+p));
  setIsolate('full');
}

// ===================== views =====================
function setView(name){
  const c = modelCenter, r = modelRadius, dist = r*3.0;
  const v = {
    front: [c.x, c.y, c.z + dist],
    rear:  [c.x, c.y, c.z - dist],
    iso:   [c.x + dist*0.8, c.y + r*1.4, c.z + dist*0.8],
    top:   [c.x + 0.001, c.y + dist*1.2, c.z + 0.001],
  }[name];
  camera.position.set(v[0], v[1], v[2]);
  controls.target.copy(c);
  ['front','rear','iso','top'].forEach(n=>document.getElementById('b-'+n).classList.toggle('active', n===name));
}
document.getElementById('b-front').onclick=()=>setView('front');
document.getElementById('b-rear').onclick =()=>setView('rear');
document.getElementById('b-iso').onclick  =()=>setView('iso');
document.getElementById('b-top').onclick  =()=>setView('top');

let spin=false;
document.getElementById('t-spin').onclick=(e)=>{ spin=!spin; e.target.classList.toggle('active',spin); };

// export current model to a real 3D file (.glb)
const exporter = new GLTFExporter();
document.getElementById('dl-3d').onclick=()=>{
  if(!currentModel) return;
  exporter.parse(currentModel, (result)=>{
    const blob = new Blob([result], {type:'model/gltf-binary'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (activeId || 'model') + '.glb';
    a.click(); URL.revokeObjectURL(a.href);
  }, (e)=>console.error('GLB export failed', e), { binary:true });
};

// export current model to DXF (3DFACE mesh, Z-up, inches) for AutoCAD/fabrication
function exportDXF(){
  if(!currentModel) return;
  currentModel.updateWorldMatrix(true, true);
  const v = new THREE.Vector3();
  const F = (n)=> (Math.abs(n) < 1e-9 ? 0 : n).toFixed(4);
  // three.js is Y-up; AutoCAD WCS is Z-up. map (x,y,z) -> (x,-z,y), right-handed, upright.
  const tri = [];
  currentModel.traverse(o=>{
    if(!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    const pos = o.geometry.attributes.position, idx = o.geometry.index, m = o.matrixWorld;
    const P = (i)=>{ v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).applyMatrix4(m); return [F(v.x), F(-v.z), F(v.y)]; };
    const n = idx ? idx.count : pos.count;
    for(let i=0;i<n;i+=3){
      const a = idx?idx.getX(i):i, b = idx?idx.getX(i+1):i+1, c = idx?idx.getX(i+2):i+2;
      tri.push([P(a), P(b), P(c)]);
    }
  });
  let s = '0\nSECTION\n2\nHEADER\n9\n$INSUNITS\n70\n1\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n';
  for(const t of tri){
    const [a,b,c] = t;
    s += '0\n3DFACE\n8\nMODEL\n';
    s += '10\n'+a[0]+'\n20\n'+a[1]+'\n30\n'+a[2]+'\n';
    s += '11\n'+b[0]+'\n21\n'+b[1]+'\n31\n'+b[2]+'\n';
    s += '12\n'+c[0]+'\n22\n'+c[1]+'\n32\n'+c[2]+'\n';
    s += '13\n'+c[0]+'\n23\n'+c[1]+'\n33\n'+c[2]+'\n'; // 4th pt = 3rd → triangular face
  }
  s += '0\nENDSEC\n0\nEOF\n';
  const blob = new Blob([s], {type:'application/dxf'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (activeId||'model') + '.dxf';
  a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById('dl-dxf').onclick = exportDXF;

// ===================== drawer / hamburger =====================
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function toggleDrawer(open){ drawer.classList.toggle('open',open); scrim.classList.toggle('show',open); }
document.getElementById('burger').onclick=()=>toggleDrawer(!drawer.classList.contains('open'));
scrim.onclick=()=>toggleDrawer(false);

const list=document.getElementById('model-list');
MODELS.forEach(entry=>{
  const el=document.createElement('div');
  el.className='model-item'; el.dataset.id=entry.id;
  el.innerHTML='<span class="dot"></span><div><div class="nm">'+entry.name+'</div><div class="ds">'+(entry.desc||'')+'</div></div>';
  el.onclick=()=>{ showModel(entry); toggleDrawer(false); };
  list.appendChild(el);
});

// ===================== loop =====================
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});
function animate(){
  requestAnimationFrame(animate);
  if (spin && currentModel) currentModel.rotation.y += 0.004;
  controls.update();
  renderer.render(scene,camera);
}
animate();

// initial model
showModel(MODELS[0]);
</script>
